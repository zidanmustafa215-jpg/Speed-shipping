<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة المندوب - شركة ميزو</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#0b1120;color:#f8fafc;min-height:100vh;padding-bottom:40px}
.hid{display:none!important}

/* شاشة الدخول */
.login-wrap{max-width:380px;margin:65px auto;background:#111827;border:1px solid #1f2937;border-radius:18px;padding:26px 20px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.brand{text-align:center;margin-bottom:20px}
.brand .logo{width:56px;height:56px;line-height:56px;border-radius:16px;background:linear-gradient(135deg,#10b981,#059669);font-size:26px;margin:0 auto 10px}
.brand h2{font-size:19px;color:#fff}
.brand p{font-size:12px;color:#94a3b8;margin-top:4px}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12px;color:#cbd5e1;margin-bottom:6px;font-weight:700}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:14px;outline:none;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#10b981}
.btn-main{width:100%;padding:12px;border:none;border-radius:11px;background:#10b981;color:#052e16;font-weight:800;font-size:15px;cursor:pointer}
.err-box{background:#450a0a;color:#fecaca;border:1px solid #991b1b;padding:9px 12px;border-radius:9px;font-size:12px;margin-bottom:12px;text-align:center}

/* الهيدر العلوي */
.top-nav{background:#111827;border-bottom:1px solid #1e293b;padding:12px 14px;position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:8px}
.drv-info h1{font-size:15px;color:#fff}
.drv-info span{font-size:11px;color:#34d399;font-weight:700}
.btn-exit{background:#1e293b;color:#fda4af;border:1px solid #334155;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer}

.container{max-width:780px;margin:12px auto;padding:0 12px}

/* كارت المحصل بالأعلى */
.collected-banner{background:linear-gradient(135deg,#064e3b,#0f172a);border:1px solid #10b981;border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.collected-banner .lbl{font-size:12px;color:#a7f3d0;font-weight:700}
.collected-banner .amt{font-size:22px;font-weight:900;color:#34d399;margin-top:3px}
.collected-banner .sub{font-size:11px;color:#cbd5e1;margin-top:2px}

/* بنود الهيد الفلاتر */
.status-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
@media(min-width:600px){.status-tabs{grid-template-columns:repeat(7,1fr)}}
.stab-btn{background:#111827;border:1px solid #1e293b;color:#cbd5e1;border-radius:12px;padding:9px 6px;cursor:pointer;text-align:center;transition:.15s}
.stab-btn .t-name{display:block;font-size:11px;font-weight:800;line-height:1.3}
.stab-btn .t-cnt{display:inline-block;margin-top:4px;background:#1e293b;color:#fff;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800}
.stab-btn.active{background:#2563eb;border-color:#3b82f6;color:#fff}
.stab-btn.active .t-cnt{background:rgba(255,255,255,.22);color:#fff}

/* كارت الأوردر */
.order-card{background:#111827;border:1px solid #1e293b;border-radius:15px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.order-card:hover{border-color:#334155}
.row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cust-name{font-size:15px;font-weight:800;color:#fff}
.right-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.icon-btn{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;font-weight:700}
.call-btn{background:#0284c7;color:#fff}
.wa-btn{background:#16a34a;color:#fff}
.price-tag{background:#064e3b;color:#6ee7b7;padding:6px 10px;border-radius:9px;font-size:13px;font-weight:900}
.merchant-line{font-size:12px;color:#93c5fd;font-weight:700;margin-top:6px}
.address-line{font-size:12px;color:#cbd5e1;margin-top:4px;line-height:1.5}
.row-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid #1e293b;flex-wrap:wrap}
.serial-badge{background:#1e293b;color:#e2e8f0;padding:3px 8px;border-radius:6px;font-family:monospace;font-size:11px;font-weight:700}
.st-chip{padding:4px 9px;border-radius:7px;font-size:11px;font-weight:800}
.c-p{background:#1e3a8a;color:#bfdbfe}
.c-d{background:#065f46;color:#a7f3d0}
.c-r{background:#7f1d1d;color:#fecaca}
.c-a{background:#78350f;color:#fde68a}
.note-line{width:100%;font-size:11px;color:#fbbf24;margin-top:4px}

.empty-state{text-align:center;color:#94a3b8;background:#111827;border:1px solid #1e293b;border-radius:14px;padding:24px;font-size:13px}

/* نافذة اختيار الحالة */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;justify-content:center;align-items:center;padding:14px}
.modal-bg.sh{display:flex}
.modal-box{background:#111827;border:1px solid #334155;border-radius:16px;padding:18px;width:100%;max-width:420px}
.modal-box h3{font-size:16px;color:#fff;margin-bottom:4px}
.modal-sub{font-size:12px;color:#94a3b8;margin-bottom:12px}
.btn-save{width:100%;padding:11px;border:none;border-radius:10px;background:#10b981;color:#052e16;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px}
.btn-cancel{width:100%;padding:10px;border:none;border-radius:10px;background:#1e293b;color:#cbd5e1;font-weight:700;font-size:13px;cursor:pointer;margin-top:8px}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="brand">
    <div class="logo">🛵</div>
    <h2>دخول المندوب - ميزو</h2>
    <p>أدخل اسم المستخدم وكلمة المرور الخاصة بك</p>
  </div>
  <div id="loginError" class="err-box hid">اسم المستخدم أو كلمة المرور غير صحيحة</div>
  <div class="fg">
    <label>اسم المستخدم</label>
    <input type="text" id="inUser" autocapitalize="off" autocomplete="off" onkeydown="if(event.key==='Enter')loginDriver()">
  </div>
  <div class="fg">
    <label>كلمة المرور</label>
    <input type="password" id="inPass" autocomplete="off" onkeydown="if(event.key==='Enter')loginDriver()">
  </div>
  <button type="button" class="btn-main" onclick="loginDriver()">تسجيل الدخول</button>
</div>

<div id="driverScreen" class="hid">
  <div class="top-nav">
    <div class="drv-info">
      <h1 id="drvTitle">المندوب</h1>
      <span>● متصل ومربوط بالنظام</span>
    </div>
    <button type="button" class="btn-exit" onclick="logoutDriver()">خروج</button>
  </div>

  <div class="container">
    <div class="collected-banner">
      <div>
        <div class="lbl">💵 المبلغ المحصل من المندوب</div>
        <div class="amt" id="collectedTotal">0 ج.م</div>
        <div class="sub" id="collectedDetail">شامل الأوردرات المسلمة والشحن المدفوع</div>
      </div>
      <div style="font-size:28px">📦</div>
    </div>

    <div class="status-tabs" id="statusTabs">
      <button type="button" class="stab-btn active" data-tab="all" onclick="selectTab('all')">
        <span class="t-name">الكل</span>
        <span class="t-cnt" id="cnt-all">0</span>
      </button>
      <button type="button" class="stab-btn" data-tab="p" onclick="selectTab('p')">
        <span class="t-name">قيد التوصيل</span>
        <span class="t-cnt" id="cnt-p">0</span>
      </button>
      <button type="button" class="stab-btn" data-tab="d" onclick="selectTab('d')">
        <span class="t-name">تم التسليم</span>
        <span class="t-cnt" id="cnt-d">0</span>
      </button>
      <button type="button" class="stab-btn" data-tab="cancel" onclick="selectTab('cancel')">
        <span class="t-name">ملغي</span>
        <span class="t-cnt" id="cnt-cancel">0</span>
      </button>
      <button type="button" class="stab-btn" data-tab="postpone" onclick="selectTab('postpone')">
        <span class="t-name">مؤجل</span>
        <span class="t-cnt" id="cnt-postpone">0</span>
      </button>
      <button type="button" class="stab-btn" data-tab="ref_nopay" onclick="selectTab('ref_nopay')">
        <span class="t-name">رفض الاستلام والدفع</span>
        <span class="t-cnt" id="cnt-ref_nopay">0</span>
      </button>
      <button type="button" class="stab-btn" data-tab="ref_pay" onclick="selectTab('ref_pay')">
        <span class="t-name">رفض الاستلام ودفع الشحن</span>
        <span class="t-cnt" id="cnt-ref_pay">0</span>
      </button>
    </div>

    <div id="ordersList"></div>
  </div>
</div>

<!-- مودال تحديث حالة الأوردر -->
<div id="statusModal" class="modal-bg">
  <div class="modal-box">
    <h3 id="modalOrderTitle">تحديث حالة الأوردر</h3>
    <div class="modal-sub" id="modalOrderSub"></div>
    <input type="hidden" id="targetOrderId">
    <div class="fg">
      <label>اختر الحالة</label>
      <select id="selStatus" onchange="handleStatusChange()">
        <option value="p">قيد التوصيل</option>
        <option value="d">تم التسليم</option>
        <option value="ref_pay">رفض الاستلام ودفع الشحن</option>
        <option value="ref_nopay">رفض الاستلام والدفع</option>
        <option value="cancel">ملغي</option>
        <option value="postpone">مؤجل</option>
      </select>
    </div>

    <div class="fg hid" id="paidShipField">
      <label>مبلغ الشحن المدفوع (ج.م)</label>
      <input type="number" id="inPaidShip" value="0" min="0">
    </div>

    <div class="fg hid" id="reasonField">
      <label id="reasonLabel">السبب</label>
      <select id="selReason"></select>
    </div>

    <div class="fg hid" id="noteField">
      <label id="noteLabel">ملاحظات / تأجيل يوم إيه؟</label>
      <textarea id="inNote" rows="2" placeholder="اكتب هنا مثلاً: تأجيل ليوم السبت أو أي تفاصيل..."></textarea>
    </div>

    <button type="button" class="btn-save" onclick="confirmOrderStatus()">حفظ الحالة</button>
    <button type="button" class="btn-cancel" onclick="closeStatusModal()">إغلاق</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtp6WvkiOgNGi4Q7KWXSyPXFw5MDECD3Y",
  authDomain: "speed-shipping-c5438.firebaseapp.com",
  databaseURL: "https://speed-shipping-c5438-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "speed-shipping-c5438",
  storageBucket: "speed-shipping-c5438.firebasestorage.app",
  messagingSenderId: "189462819551",
  appId: "1:189462819551:web:4516fd59884d9d8fcb2f6a",
  measurementId: "G-85ZTZX3KWH"
};

firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();
const FB_PATH = "mz_cloud_db/v3";

const getTodayStr = ()=>{
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
};

let db = { d:[], m:[], s:[], settlements:[], bizDate:getTodayStr() };
let currentDriverId = sessionStorage.getItem('mz_active_driver_id') || '';
let activeTab = 'all';

const fixNum = str => String(str||'').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
const getMerchantName = id => (db.m.find(x => x.id === id) || {}).n || '-';
const orderTotal = o => (Number(o.p)||0) + (Number(o.f)||0);

function collectedFromOrder(o){
  if(o.st === 'd') return orderTotal(o);
  if(o.st === 'ref_pay') return Number(o.paidShip) || 0;
  return 0;
}

function toWhatsAppUrl(rawPhone){
  let clean = fixNum(rawPhone).replace(/[^0-9]/g, '');
  if(clean.startsWith('01') && clean.length === 11) clean = '2' + clean;
  else if(clean.startsWith('1') && clean.length === 10) clean = '20' + clean;
  return 'https://wa.me/' + clean;
}

function normalizeDb(src){
  const j = src || {};
  return {
    adm: j.adm || {u:'admin',p:'1234'},
    d: Array.isArray(j.d) ? j.d : Object.values(j.d || {}),
    m: Array.isArray(j.m) ? j.m : Object.values(j.m || {}),
    s: Array.isArray(j.s) ? j.s : Object.values(j.s || {}),
    staff: Array.isArray(j.staff) ? j.staff : Object.values(j.staff || {}),
    settlements: Array.isArray(j.settlements) ? j.settlements : Object.values(j.settlements || {}),
    bizDate: j.bizDate || getTodayStr()
  };
}

function normalizeBucket(st){
  if(st === 'r' || st === 'rw' || st === 'rm') return 'ref_nopay';
  return st || 'p';
}

function statusBadge(o){
  const b = normalizeBucket(o.st);
  const subTxt = o.reasonSub ? ` (${o.reasonSub})` : '';
  const map = {
    p: ['قيد التوصيل', 'c-p'],
    d: ['تم التسليم', 'c-d'],
    cancel: [`ملغي${subTxt}`, 'c-r'],
    postpone: [`مؤجل${subTxt}`, 'c-a'],
    ref_nopay: [`رفض الاستلام والدفع${subTxt}`, 'c-r'],
    ref_pay: [`رفض الاستلام ودفع الشحن (${o.paidShip||0} ج.م)`, 'c-a']
  };
  return map[b] || ['قيد التوصيل', 'c-p'];
}

function selectTab(tabKey){
  activeTab = tabKey;
  document.querySelectorAll('.stab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tabKey);
  });
  renderDriverView();
}

function loginDriver(){
  const u = fixNum(document.getElementById('inUser').value).toLowerCase();
  const p = fixNum(document.getElementById('inPass').value);
  const errBox = document.getElementById('loginError');

  if(!Array.isArray(db.d) || db.d.length === 0){
    errBox.innerText = 'لم يتم تحميل بيانات المناديب من قاعدة البيانات بعد، انتظر ثانية أو راجع صلاحيات Firebase';
    errBox.classList.remove('hid');
    return;
  }

  const drv = db.d.find(x => {
    const du = fixNum(x.u ?? x.user ?? x.username ?? '').toLowerCase();
    const dp = fixNum(x.p ?? x.pass ?? x.password ?? '');
    return du === u && dp === p;
  });

  if(!drv){
    errBox.innerText = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    errBox.classList.remove('hid');
    return;
  }

  errBox.classList.add('hid');
  currentDriverId = drv.id;
  sessionStorage.setItem('mz_active_driver_id', currentDriverId);
  renderDriverView();
}

function logoutDriver(){
  currentDriverId = '';
  sessionStorage.removeItem('mz_active_driver_id');
  document.getElementById('inUser').value = '';
  document.getElementById('inPass').value = '';
  renderDriverView();
}

function renderDriverView(){
  if(!currentDriverId){
    document.getElementById('loginScreen').classList.remove('hid');
    document.getElementById('driverScreen').classList.add('hid');
    return;
  }
  const drv = db.d.find(x => x.id === currentDriverId);
  if(!drv){ logoutDriver(); return; }

  document.getElementById('loginScreen').classList.add('hid');
  document.getElementById('driverScreen').classList.remove('hid');
  document.getElementById('drvTitle').innerText = '🛵 ' + drv.n;

  const assigned = db.s.filter(x => x.d === drv.id && x.st !== 'w' && x.st !== 'rw' && x.st !== 'rm');

  const counts = { all: assigned.length, p: 0, d: 0, cancel: 0, postpone: 0, ref_nopay: 0, ref_pay: 0 };
  let totalCollected = 0;

  assigned.forEach(o => {
    const b = normalizeBucket(o.st);
    if(counts[b] !== undefined) counts[b]++;
    totalCollected += collectedFromOrder(o);
  });

  Object.keys(counts).forEach(k => {
    const el = document.getElementById('cnt-' + k);
    if(el) el.innerText = counts[k];
  });

  document.getElementById('collectedTotal').innerText = totalCollected + ' ج.م';

  const filtered = activeTab === 'all'
    ? assigned
    : assigned.filter(o => normalizeBucket(o.st) === activeTab);

  document.getElementById('ordersList').innerHTML = filtered.map(o => {
    const [stTxt, stCls] = statusBadge(o);
    const phoneHref = 'tel:' + fixNum(o.cp);
    const waHref = toWhatsAppUrl(o.cp);
    return `<div class="order-card" onclick="openStatusSheet('${o.id}')">
      <div class="row-top">
        <div class="cust-name">${o.cn}</div>
        <div class="right-tools" onclick="event.stopPropagation()">
          <a class="icon-btn call-btn" href="${phoneHref}" title="اتصال بالعميل">📞</a>
          <a class="icon-btn wa-btn" href="${waHref}" target="_blank" rel="noopener" title="واتساب العميل">💬</a>
          <span class="price-tag">${orderTotal(o)} ج.م</span>
        </div>
      </div>
      <div class="merchant-line">🏪 التاجر: ${getMerchantName(o.m)}</div>
      <div class="address-line">📍 العنوان: ${o.ca}</div>
      <div class="row-bottom">
        <span class="serial-badge">${o.serial || '-'}</span>
        <span class="st-chip ${stCls}">${stTxt}</span>
        ${o.reasonNote ? `<div class="note-line">📝 ملاحظة: ${o.reasonNote}</div>` : ''}
      </div>
    </div>`;
  }).join('') || '<div class="empty-state">لا توجد أوردرات في هذا البند حالياً</div>';
}

function openStatusSheet(orderId){
  const o = db.s.find(x => x.id === orderId);
  if(!o) return;
  document.getElementById('targetOrderId').value = orderId;
  document.getElementById('modalOrderTitle').innerText = '📦 ' + o.cn;
  document.getElementById('modalOrderSub').innerText = `السريال: ${o.serial || '-'} | الإجمالي: ${orderTotal(o)} ج.م`;
  document.getElementById('selStatus').value = normalizeBucket(o.st);
  document.getElementById('inPaidShip').value = o.paidShip || o.f || 0;
  document.getElementById('inNote').value = o.reasonNote || '';
  handleStatusChange(o.reasonSub || '');
  document.getElementById('statusModal').classList.add('sh');
}

function closeStatusModal(){
  document.getElementById('statusModal').classList.remove('sh');
}

function handleStatusChange(presetReason=''){
  const val = document.getElementById('selStatus').value;
  const shipBox = document.getElementById('paidShipField');
  const reasonBox = document.getElementById('reasonField');
  const reasonLbl = document.getElementById('reasonLabel');
  const reasonSel = document.getElementById('selReason');
  const noteBox = document.getElementById('noteField');
  const noteLbl = document.getElementById('noteLabel');

  shipBox.classList.add('hid');
  reasonBox.classList.add('hid');
  noteBox.classList.add('hid');

  if(val === 'ref_pay'){
    shipBox.classList.remove('hid');
    noteBox.classList.remove('hid');
    noteLbl.innerText = 'ملاحظات (اختياري)';
  }else if(val === 'ref_nopay'){
    reasonBox.classList.remove('hid');
    noteBox.classList.remove('hid');
    reasonLbl.innerText = 'سبب رفض الاستلام والدفع';
    reasonSel.innerHTML = '<option value="عميل متهرب">عميل متهرب</option><option value="بعد المعاينة">بعد المعاينة</option>';
    noteLbl.innerText = 'ملاحظات (اختياري)';
  }else if(val === 'cancel'){
    reasonBox.classList.remove('hid');
    noteBox.classList.remove('hid');
    reasonLbl.innerText = 'سبب الإلغاء';
    reasonSel.innerHTML = '<option value="منتج خطأ">منتج خطأ</option><option value="ملغي من العميل">ملغي من العميل</option>';
    noteLbl.innerText = 'ملاحظات / تأجيل يوم إيه؟';
  }else if(val === 'postpone'){
    reasonBox.classList.remove('hid');
    noteBox.classList.remove('hid');
    reasonLbl.innerText = 'سبب التأجيل';
    reasonSel.innerHTML = '<option value="من العميل">من العميل</option><option value="رقم خطأ">رقم خطأ</option><option value="عنوان خطأ">عنوان خطأ</option>';
    noteLbl.innerText = 'تأجيل يوم إيه؟ (ملاحظات)';
  }

  if(presetReason && Array.from(reasonSel.options).some(opt => opt.value === presetReason)){
    reasonSel.value = presetReason;
  }
}

function confirmOrderStatus(){
  const id = document.getElementById('targetOrderId').value;
  const o = db.s.find(x => x.id === id);
  if(!o) return;

  const val = document.getElementById('selStatus').value;
  o.st = val;
  o.reasonNote = document.getElementById('inNote').value.trim();

  if(val === 'ref_pay'){
    o.paidShip = Math.max(0, +fixNum(document.getElementById('inPaidShip').value) || 0);
    o.reasonSub = 'دفع شحن';
  }else if(val === 'ref_nopay' || val === 'cancel' || val === 'postpone'){
    o.paidShip = 0;
    o.reasonSub = document.getElementById('selReason').value;
  }else{
    o.paidShip = 0;
    o.reasonSub = '';
  }

  fbDb.ref(FB_PATH).set(db).catch(err => console.warn(err));
  closeStatusModal();
  renderDriverView();
}

fbDb.ref(FB_PATH).on('value', snap => {
  if(!snap.exists()) return;
  db = normalizeDb(snap.val());
  renderDriverView();
});

renderDriverView();
</script>
</body>
</html>
